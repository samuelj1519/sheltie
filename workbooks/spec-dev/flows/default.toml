schema = "flow/v1"
id = "default"
entry = "spec"

# tier guides coordinator model selection: strong requires design judgment; use the strongest model;
# standard means fill implementations, run commands, compare checklists; an economical model suffices.

# ── Planning: strong-model drafts, human approval, strong-model scaffolding ────────────────

[[nodes]]
id = "spec"
title = "Write requirements"
executor = "agent"
tier = "strong"
instruction = { file = "instructions/spec.md" }
inputs = [
  { name = "request",   from = "start.request" },
  { name = "project",   from = "start.project" },
  { name = "template",  from = "resource.resources/templates/spec.md" },
  { name = "checklist", from = "resource.resources/checklists/spec-checklist.md" },
  { name = "decision",  from = "plan-review.decision", required = false },
]
outputs = [{ name = "spec", path = "spec.md", max_bytes = 65536 }]
max_visits = 3

[[nodes]]
id = "plan"
title = "Write the technical plan and task list"
executor = "agent"
tier = "strong"
instruction = { file = "instructions/plan.md" }
inputs = [
  { name = "spec",       from = "spec.spec" },
  { name = "project",    from = "start.project" },
  { name = "plan_tpl",   from = "resource.resources/templates/plan.md" },
  { name = "tasks_tpl",  from = "resource.resources/templates/tasks.md" },
  { name = "task_rules", from = "resource.resources/checklists/task-rules.md" },
  { name = "decision",   from = "plan-review.decision", required = false },
  { name = "escalation", from = "escalate.decision",    required = false },
  { name = "previous_plan", from = "plan-review.reviewed-plan", required = false },
  { name = "previous_tasks", from = "plan-review.reviewed-tasks", required = false },
  { name = "previous_verification", from = "verify.report", required = false },
  { name = "previous_change", from = "implement.change", required = false },
  { name = "previous_fix_change", from = "fix.change", required = false },
]
outputs = [
  { name = "plan",  path = "plan.md",  max_bytes = 65536 },
  { name = "tasks", path = "tasks.md", max_bytes = 65536 },
]
max_visits = 4

[[nodes]]
id = "plan-review"
title = "Human review of specification and plan"
executor = "human"
instruction = { file = "instructions/plan-review.md" }
inputs = [
  { name = "spec",  from = "spec.spec" },
  { name = "plan",  from = "plan.plan" },
  { name = "tasks", from = "plan.tasks" },
]
outputs = [
  { name = "decision", path = "decision.md", max_bytes = 16384 },
  { name = "reviewed-plan", path = "reviewed-plan.md", max_bytes = 65536 },
  { name = "reviewed-tasks", path = "reviewed-tasks.md", max_bytes = 65536 },
]
max_visits = 4

[[nodes]]
id = "scaffold"
title = "Scaffold types, signatures, and disabled tests"
executor = "agent"
tier = "strong"
instruction = { file = "instructions/scaffold.md" }
inputs = [
  { name = "approval_rules", from = "resource.resources/checklists/approval-rules.md" },
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "tasks",      from = "plan.tasks" },
  { name = "decision",   from = "plan-review.decision" },
  { name = "escalation", from = "escalate.decision",    required = false },
  { name = "project",    from = "start.project" },
  { name = "rules",      from = "resource.resources/checklists/scaffold-rules.md" },
  { name = "template",   from = "resource.resources/templates/scaffold.md" },
]
outputs = [{ name = "scaffold", path = "scaffold.md", max_bytes = 65536 }]
max_visits = 4
max_retries = 1

# ── Implementation: one task at a time, independent verification, human escalation when blocked ───────────

[[nodes]]
id = "implement"
title = "Implement one task"
executor = "agent"
tier = "standard"
instruction = { file = "instructions/implement.md" }
inputs = [
  { name = "approval_rules", from = "resource.resources/checklists/approval-rules.md" },
  { name = "tasks",      from = "plan.tasks" },
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "scaffold",   from = "scaffold.scaffold" },
  { name = "project",    from = "start.project" },
  { name = "rules",      from = "resource.resources/checklists/implementer-rules.md" },
  { name = "report",     from = "verify.report",    required = false },
  { name = "decision",   from = "plan-review.decision" },
  { name = "escalation", from = "escalate.decision", required = false },
]
outputs = [{ name = "change", path = "change.md", max_bytes = 32768 }]
max_visits = 24
max_retries = 1

[[nodes]]
id = "verify"
title = "Verify this task"
executor = "agent"
tier = "standard"
instruction = { file = "instructions/verify.md" }
inputs = [
  { name = "approval_rules", from = "resource.resources/checklists/approval-rules.md" },
  { name = "tasks",      from = "plan.tasks" },
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "scaffold",   from = "scaffold.scaffold" },
  { name = "change",     from = "implement.change" },
  { name = "fix_change", from = "fix.change", required = false },
  { name = "project",    from = "start.project" },
  { name = "template",   from = "resource.resources/templates/report.md" },
  { name = "decision",   from = "plan-review.decision" },
  { name = "escalation", from = "escalate.decision", required = false },
]
outputs = [{ name = "report", path = "report.md", max_bytes = 32768 }]
max_visits = 32

[[nodes]]
id = "fix"
title = "Fix verification or review findings"
executor = "agent"
tier = "standard"
instruction = { file = "instructions/fix.md" }
inputs = [
  { name = "tasks",         from = "plan.tasks" },
  { name = "plan",          from = "plan.plan" },
  { name = "scaffold",      from = "scaffold.scaffold" },
  { name = "project",       from = "start.project" },
  { name = "rules",         from = "resource.resources/checklists/implementer-rules.md" },
  { name = "verify_report", from = "verify.report",    required = false },
  { name = "review_report", from = "review.report",    required = false },
  { name = "escalation",    from = "escalate.decision", required = false },
]
outputs = [{ name = "change", path = "change.md", max_bytes = 32768 }]
max_visits = 16
max_retries = 1

[[nodes]]
id = "escalate"
title = "Human decision: blockage, repeated failure, or authorization"
executor = "human"
instruction = { file = "instructions/escalate.md" }
inputs = [
  { name = "spec",             from = "spec.spec" },
  { name = "approval",         from = "plan-review.decision" },
  { name = "tasks",            from = "plan.tasks" },
  { name = "plan",             from = "plan.plan" },
  { name = "scaffold_report",  from = "scaffold.scaffold",  required = false },
  { name = "implement_change", from = "implement.change",   required = false },
  { name = "fix_change",       from = "fix.change",         required = false },
  { name = "verify_report",    from = "verify.report",      required = false },
]
outputs = [{ name = "decision", path = "decision.md", max_bytes = 16384 }]
max_visits = 6

# ── Completion: overall review, delivery, reflection, human approval ───────────────────

[[nodes]]
id = "review"
title = "Review the complete change"
executor = "agent"
tier = "strong"
instruction = { file = "instructions/review.md" }
inputs = [
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "tasks",      from = "plan.tasks" },
  { name = "scaffold",   from = "scaffold.scaffold" },
  { name = "project",    from = "start.project" },
  { name = "fix_change", from = "fix.change", required = false },
  { name = "checklist",  from = "resource.resources/checklists/review-checklist.md" },
  { name = "template",   from = "resource.resources/templates/report.md" },
]
outputs = [{ name = "report", path = "report.md", max_bytes = 32768 }]
max_visits = 4

[[nodes]]
id = "deliver"
title = "Write delivery notes"
executor = "agent"
tier = "standard"
instruction = { file = "instructions/deliver.md" }
inputs = [
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "tasks",      from = "plan.tasks" },
  { name = "project",    from = "start.project" },
  { name = "report",     from = "review.report",    required = false },
  { name = "escalation", from = "escalate.decision", required = false },
]
outputs = [{ name = "delivery", path = "delivery.md", max_bytes = 32768 }]

[[nodes]]
id = "retro"
title = "Reflect on workflow improvements"
executor = "agent"
tier = "standard"
instruction = { file = "instructions/retro.md" }
inputs = [
  { name = "stats",      from = "engine.stats" },
  { name = "spec",       from = "spec.spec" },
  { name = "plan",       from = "plan.plan" },
  { name = "delivery",   from = "deliver.delivery", result = true },
  { name = "decision",   from = "plan-review.decision" },
  { name = "escalation", from = "escalate.decision", required = false },
  { name = "review",     from = "review.report",     required = false },
  { name = "template",   from = "resource.resources/templates/lessons.md" },
  { name = "rules",      from = "resource.resources/checklists/retro-rules.md" },
]
outputs = [{ name = "lessons", path = "lessons.md", result = true, max_bytes = 32768 }]
gate = true

# ── Edges ───────────────────────────────────────────────────────

# Planning
[[edges]]
from = "spec"
to = "plan"
kind = "main"

[[edges]]
from = "plan"
to = "plan-review"
kind = "main"

[[edges]]
from = "plan-review"
to = "scaffold"
kind = "main"

[[edges]]
from = "plan-review"
to = "spec"
kind = "back"

[[edges]]
from = "plan-review"
to = "plan"
kind = "back"

[[edges]]
from = "scaffold"
to = "implement"
kind = "main"

# Implementation and verification loop
[[edges]]
from = "implement"
to = "verify"
kind = "main"

[[edges]]
from = "verify"
to = "implement"
kind = "main"

[[edges]]
from = "verify"
to = "review"
kind = "main"

[[edges]]
from = "verify"
to = "fix"
kind = "branch"

[[edges]]
from = "fix"
to = "verify"
kind = "re_review"

# Review loop
[[edges]]
from = "review"
to = "deliver"
kind = "main"

[[edges]]
from = "deliver"
to = "retro"
kind = "main"

[[edges]]
from = "review"
to = "fix"
kind = "branch"

[[edges]]
from = "fix"
to = "review"
kind = "re_review"

# Escalation: the blocked stage enters
[[edges]]
from = "scaffold"
to = "escalate"
kind = "branch"

[[edges]]
from = "implement"
to = "escalate"
kind = "branch"

[[edges]]
from = "fix"
to = "escalate"
kind = "branch"

[[edges]]
from = "verify"
to = "escalate"
kind = "branch"

# Human decisions (Continue returns to blocked scaffold, implement, fix, or verify)
[[edges]]
from = "escalate"
to = "scaffold"
kind = "back"

[[edges]]
from = "escalate"
to = "implement"
kind = "main"

[[edges]]
from = "escalate"
to = "fix"
kind = "back"

[[edges]]
from = "escalate"
to = "verify"
kind = "back"

[[edges]]
from = "escalate"
to = "plan"
kind = "back"

[[edges]]
from = "escalate"
to = "deliver"
kind = "branch"
