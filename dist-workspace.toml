# cargo-dist 发布配置（存储合同 §9）。T20 按当前格式手写；
# T25 打 tag 后可用 `cargo dist generate` 校对再生。
[dist]
cargo-dist-version = "0.32.0"
rust-toolchain-version = "1.85.0"
dist = true
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
ci = ["github"]
pr-run-mode = "plan"
create-release = true
github-release = true
