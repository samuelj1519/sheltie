<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook 作者工具 · Sheltie</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><strong>Sheltie</strong><span>Workbook 作者工具</span></div><div class="actions"><button id="new">新建方法</button><button id="open">打开目录</button><input id="directory" type="file" webkitdirectory multiple hidden><button id="check">检查结构</button><button id="save" class="primary">保存新副本 ZIP</button></div></header>
<div class="workspace">
<nav id="navigation" aria-label="方法与 Flow"><div class="panel-head"><span>方法与 Flow</span></div><div id="method"></div><div id="flows"></div><button id="add-flow">＋ 增加 Flow</button><div class="panel-head">当前节点</div><div id="node-list"></div><details class="samples"><summary>从现有样例开始</summary><button id="sample-code">代码变更</button><button id="sample-spec">规格开发</button></details><p class="hint">目录限 16 MiB / 1024 文件。下载 ZIP 后解压，再打开目录。</p></nav>
<main><div class="canvas-toolbar"><button id="toggle-nav" aria-label="展开或折叠导航">导航</button><span id="flow-label"></span><button id="add-node">＋ 节点</button><button id="add-edge">＋ 显式边</button><div class="spacer"></div><button id="zoom-out" aria-label="缩小画布">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="放大画布">＋</button><button id="reset-view">适应画布</button><button id="toggle-props">属性</button></div><div id="viewport" tabindex="0" aria-label="节点画布，拖动空白平移，滚轮缩放"><div id="world"><svg id="edges" aria-label="显式边"></svg><div id="nodes"></div></div><div class="canvas-help">拖动节点编排视图 · 拖动空白平移 · 滚轮缩放</div></div></main>
<aside id="properties" aria-label="属性"><div class="panel-head"><span id="property-title">属性</span></div><div id="property-content"></div></aside>
</div>
<footer><div id="status" role="status" aria-live="polite">正在连接本地服务…</div><section id="error-summary" hidden aria-label="结构错误定位"><p id="error-message"></p><dl id="error-fields"></dl><p id="error-next"></p><p id="error-file-note" class="field-help"></p><div id="error-links"></div></section><details id="error-details"><summary>技术诊断（原始命令、输出与异常）</summary><pre id="error-text"></pre></details></footer>
<script type="module" src="/app.mjs"></script>
</body></html>
