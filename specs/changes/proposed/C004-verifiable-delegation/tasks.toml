# C004 任务白名单（草案）。package 采用、移入 active/ 后生效；路径为暂定，C004-T02 按 C002 完成后的代码定死并在同一提交里更新本文件与 plan.md。
# 用法：scripts/check-task.sh C004-Tnn [base] [--staged]。默认基准是最近一个 c004-t* tag（T02 负责让工具支持这一点，见 plan.md §0.3）。
# files：本任务允许修改的文件或目录前缀。
# test_files：测试所在文件；allow_test_changes = false 时只许删 #[ignore 行，与 files 重叠的混合源文件从 #[cfg(test)] 起比较；快照不许改。
# 里程碑 C004-Mn 不经 check-task 核对，不在本表登记；审查者补测试的提交写 Task: C004-Mn。
# 条件任务（plan.md §3）由 C004-T01 在采用决定后追加，未采用的不登记。

