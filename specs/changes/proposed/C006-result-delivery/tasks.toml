# C006 任务白名单（草案）。package 采用、移入 active/ 后生效；路径为暂定，C006-T02 按实施起点代码定死并在同一提交里更新本文件与 plan.md。
# 用法：scripts/check-task.sh C006-Tnn [base] [--staged]。默认基准是最近一个 c006-t* tag（见 plan.md §0.3）。
# files：本任务允许修改的文件或目录前缀。
# test_files：测试所在文件；allow_test_changes = false 时只许删 #[ignore 行，与 files 重叠的混合源文件从 #[cfg(test)] 起比较；快照不许改。
# 里程碑 C006-Mn 不经 check-task 核对，不在本表登记。§3、§4 增量组插入时再追加 C006-T30 起的条目。

