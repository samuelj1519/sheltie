# C002 任务白名单。用法与 legacy 表相同：scripts/check-task.sh C002-Tnn 按此核对改动范围。
# 与 MVP 填空不同：C002 的测试由各任务自己编写，全部任务 allow_test_changes = true；
# 期望值必须来自独立 oracle（plan.md §1），review 时核对。
# files / test_files 条目可以是文件或目录（目录作为前缀白名单）。

