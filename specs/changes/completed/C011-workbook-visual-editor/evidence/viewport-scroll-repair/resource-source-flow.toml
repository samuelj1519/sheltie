schema = "flow/v1"
id = "default"
entry = "implement"

[[nodes]]
id = "implement"
title = "实现代码变更"
executor = "agent"
tier = "strong"
max_visits = 3
max_retries = 1

[nodes.instruction]
file = "instructions/implement.md"

[[nodes.inputs]]
name = "task"
from = "start.task"

[[nodes.inputs]]
name = "project"
from = "start.project"

[[nodes.inputs]]
name = "previous-review"
from = "review.review"
required = false

[[nodes.outputs]]
name = "change"
path = "change.md"
max_bytes = 262144

[[nodes]]
id = "review"
title = "独立审查代码变更"
executor = "agent"
tier = "strong"
max_visits = 3
max_retries = 1

[nodes.instruction]
file = "instructions/review.md"

[[nodes.inputs]]
name = "task"
from = "start.task"

[[nodes.inputs]]
name = "project"
from = "start.project"

[[nodes.inputs]]
name = "change"
from = "resource.instructions/implement.md"

[[nodes.outputs]]
name = "review"
path = "review.md"
max_bytes = 262144

[[nodes]]
id = "deliver"
title = "整理最终成果"
executor = "agent"
max_visits = 1
max_retries = 1

[nodes.instruction]
file = "instructions/deliver.md"

[[nodes.inputs]]
name = "task"
from = "start.task"

[[nodes.inputs]]
name = "change"
from = "implement.change"
result = true

[[nodes.inputs]]
name = "review"
from = "review.review"
result = true

[[nodes.outputs]]
name = "delivery"
path = "delivery.md"
result = true
max_bytes = 262144

[[edges]]
from = "implement"
to = "review"
kind = "main"

[[edges]]
from = "review"
to = "implement"
kind = "back"

[[edges]]
from = "review"
to = "deliver"
kind = "main"
