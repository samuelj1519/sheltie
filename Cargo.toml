[workspace]
resolver = "3"
members = ["crates/sheltie-core", "crates/sheltie-runtime", "crates/sheltie-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/samuelj1519/sheltie"

[workspace.dependencies]
sheltie-core = { path = "crates/sheltie-core" }
sheltie-runtime = { path = "crates/sheltie-runtime" }

camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v7"] }

assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
proptest = "1"
tempfile = "3"


[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
installers = ["shell"]
install-path = "~/.sheltie/bin"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
ci = ["github"]
pr-run-mode = "plan"
github-release = "announce"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# dist build 用的发布 profile（cargo-dist 约定）
[profile.dist]
inherits = "release"
lto = "thin"
