[workspace]
resolver = "3"
members = ["crates/sheltie-core", "crates/sheltie-runtime", "crates/sheltie-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/samuelj1519/sheltie"

[workspace.dependencies]
sheltie-core = { path = "crates/sheltie-core" }
sheltie-runtime = { path = "crates/sheltie-runtime" }

camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v7"] }
fs4 = "0.13"
uzers = "0.12"
rustix = { version = "=1.1.4", features = ["fs"] }

assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
proptest = "1"
tempfile = "3"


[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
installers = ["shell"]
install-path = "~/.sheltie/bin"
targets = [
  "aarch64-apple-darwin",
]
ci = ["github"]
pr-run-mode = "upload"
github-release = "announce"
# release.yml 里有 dist 不生成的自定义步骤（skill 交付打包、质量门禁）；不许 dist init
# 重新生成时把它们当成过期内容拒绝。重新跑 dist init 后要照注释把这些步骤补回。
allow-dirty = ["ci"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# dist build 用的发布 profile（cargo-dist 约定）
[profile.dist]
inherits = "release"
lto = "thin"
