[package]
name = "sheltie-cli"
description = "sheltie 命令行：参数解析、文本与 JSON 输出、退出码。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sheltie"
path = "src/main.rs"

[features]
failpoint = ["sheltie-runtime/failpoint"]

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sheltie-core = { workspace = true }
sheltie-runtime = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sheltie-core = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }

[lints]
workspace = true
