[package]
name = "sheltie-core"
description = "Pure Sheltie engine rules: parsing, compilation, state machines, and rendering. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test support: fixed graphs, state, and clock; enabled by runtime and CLI tests.
testkit = []

[dependencies]
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
sheltie-core = { path = ".", features = ["testkit"] }

[lints]
workspace = true
