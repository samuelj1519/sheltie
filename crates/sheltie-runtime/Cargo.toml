[package]
name = "sheltie-runtime"
description = "Sheltie engine I/O: management root, SQLite, Workbook repository, Work service, and self-updates. No business judgments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Crash-test fault injection: setting SHELTIE_FAILPOINT=<name> exits at that point.
failpoint = []

[dependencies]
camino = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sheltie-core = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
fs4 = { workspace = true }
rustix = { workspace = true }

[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }

[dev-dependencies]
sheltie-core = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }

[lints]
workspace = true
