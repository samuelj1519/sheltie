fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
  - repo: local
    hooks:
      - id: check-docs
        name: check docs
        description: Markdown links resolve; forbidden phrasing absent.
        entry: scripts/check-docs.sh
        language: script
        files: \.md$
        pass_filenames: false
      - id: check-specs
        name: check specs governance
        description: Change lifecycle, ADR, release, and agent entry stay consistent.
        entry: scripts/check-specs.sh
        language: script
        files: (AGENTS\.md|CHANGELOG\.md|Cargo\.toml|scripts/check-specs\.sh|specs/.*)
        pass_filenames: false
      - id: check-skill
        name: check sheltie skill
        description: Skill commands exist in the protocol; no storage internals.
        entry: scripts/check-skill.sh
        language: script
        files: (skills/sheltie/SKILL\.md|specs/contracts/protocol\.md)$
        pass_filenames: false
      - id: check-core-vocab
        name: check engine vocabulary
        entry: scripts/check-core-vocab.sh
        language: script
        files: \.rs$
        pass_filenames: false
      - id: check-tests
        name: check test names and owners
        entry: scripts/check-tests.sh
        language: script
        files: (\.rs|plan\.md)$
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cargo fmt --all -- --check'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: bash -c 'cargo check --all-targets --all-features'
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny check
        entry: bash -c 'cargo deny check'
        language: system
        files: (Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
      - id: cargo-test
        name: cargo nextest
        entry: bash -c 'cargo nextest run --all-features --no-tests=pass'
        language: system
        files: (\.rs|Cargo\.(toml|lock)|\.snap)$
        pass_filenames: false
