schema = "flow/v1"
id = "default"
entry = "notes"

[[nodes]]
id = "notes"
title = "Generate release notes"
executor = "agent"
instruction = { file = "instructions/notes.md" }
inputs  = [{ name = "version", from = "start.version" }]
outputs = [{ name = "notes", path = "notes.md", max_bytes = 65536 }]
gate = true

[[nodes]]
id = "archive"
title = "Archive"
executor = "agent"
instruction = { file = "instructions/archive.md" }
inputs  = [{ name = "notes", from = "notes.notes" }]
outputs = [{ name = "archive", path = "archive.md", max_bytes = 65536 }]

[[edges]]
from = "notes"
to = "archive"
kind = "main"
