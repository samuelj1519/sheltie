name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check docs
        run: scripts/check-docs.sh
      - name: Check typos
        uses: crate-ci/typos@master

  build-rust:
    needs: docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check code format
        run: cargo fmt --all -- --check
      - name: Check the workspace for errors
        run: cargo check --all-targets --all-features
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check dependencies
        run: cargo deny check
      - name: Execute rust tests
        run: cargo nextest run --all-features --no-tests=pass
      - name: Check engine vocabulary
        run: scripts/check-core-vocab.sh
      - name: Check test names and owners
        run: scripts/check-tests.sh

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
