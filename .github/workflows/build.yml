name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # Governance resolves release tags and fixed historical commits;
      # a shallow checkout omits old tags, so check-specs can only report incomplete history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check docs
        run: scripts/check-docs.sh
      - name: Check specs governance
        run: scripts/check-specs.sh
      - name: Check skill
        run: scripts/check-skill.sh
      - name: Check English defaults and language links
        run: python3 scripts/check-language.py
      - name: Check bilingual Wiki source and exporter
        run: |
          python3 scripts/wiki.py check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_wiki.py
      - name: Check typos
        uses: crate-ci/typos@master

  build-rust:
    needs: docs
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-deny
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check code format
        run: cargo fmt --all -- --check
      - name: Check the workspace for errors
        run: cargo check --all-targets --all-features
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check dependencies
        run: cargo deny check
      - name: Execute rust tests
        run: cargo nextest run --all-features --no-tests=pass
      - name: Check engine vocabulary
        run: scripts/check-core-vocab.sh
      - name: Check test names and owners
        run: scripts/check-tests.sh

  # MSRV 1.85 locked gate (C002-T15): stable success does not replace it.
  # On failure, use evidence to fix dependencies or raise the declared MSRV; never skip it.
  msrv:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check workspace at MSRV with locked deps
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
