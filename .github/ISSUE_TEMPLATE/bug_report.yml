name: Bug report
description: Report a reproducible failure in Sheltie.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Remove credentials and private Work data. Use SECURITY.md for sensitive vulnerabilities."
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Binary version or source commit, macOS version, architecture, and filesystem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and a minimal Workbook or fixture where relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error code and relevant output, without private data.
    validations:
      required: true
