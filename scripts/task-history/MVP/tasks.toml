# MVP legacy allowlists share the original closed plan section 2 source. Preserve T01–T26 checks; register later tasks only in their active package.
# Ownership comes from adjacent // Task: Tnn comments (original plan section 0.5).
# files: source paths this task may change.
# test_files: only ignore removal is allowed; mixed files compare from #[cfg(test)].
# allow_test_changes: true allows test edits, historically for scenario bug fixes only.
