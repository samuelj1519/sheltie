[default]
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "[0-9a-f]{64}"]

[default.extend-words]
WRONLY = "WRONLY"

[files]
extend-exclude = [
  # 按源摘要封存的导出载荷是原字节资料，不能由拼写自动修复改写。
  "specs/changes/*/*/evidence/*/final-report-copies/*/artifacts/*/*",
  "CHANGELOG.md",
  "notebooks/*",
  "specs/changes/active/C002-v0.2.0-reliability/review-m1-2026-09-28.md",
  "specs/changes/active/C002-v0.2.0-reliability/evidence/m1-2026-09-28/spec/*.md",
  "specs/changes/active/C002-v0.2.0-reliability/evidence/m1-2026-09-28/standards/*.md",
  "specs/changes/completed/C002-v0.2.0-reliability/review-m1-2026-09-28.md",
  "specs/changes/completed/C002-v0.2.0-reliability/evidence/m1-2026-09-28/spec/*.md",
  "specs/changes/completed/C002-v0.2.0-reliability/evidence/m1-2026-09-28/standards/*.md",
]
