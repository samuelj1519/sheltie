[default]
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "[0-9a-f]{64}"]

[default.extend-words]
WRONLY = "WRONLY"

[files]
extend-exclude = [
  # Export payloads sealed by source digest are original bytes; spelling fixes must not rewrite them.
  "specs/changes/*/*/evidence/*/final-report-copies/*/artifacts/*/*",
  "CHANGELOG.md",
  "notebooks/*",
]
